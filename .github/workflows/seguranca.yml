name: Segurança do grupo 3
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      alvo:
        description: Versão que será analisada
        required: true
        default: corrigido
        type: choice
        options: [inseguro, corrigido]
permissions:
  contents: read
jobs:
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALVO: ${{ inputs.alvo || 'corrigido' }}
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar as duas ferramentas
        run: |
          python -m pip install -r requirements-scanners.txt
          npm install -g npm@11.12.0 --ignore-scripts
      - name: Rodar os scanners e aplicar o gate
        run: python scripts/scan.py "$ALVO"
      - name: Guardar os relatórios mesmo quando o gate bloqueia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-${{ env.ALVO }}-${{ github.run_number }}
          path: reports/${{ env.ALVO }}/
          if-no-files-found: error
  politica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir bloqueio de HIGH, CRITICAL e erro de execução
        run: python scripts/test_gate.py
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar e conferir a versão corrigida no container
        run: |
          docker compose build lab
          docker compose run --rm lab corrigido
